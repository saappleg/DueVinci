<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A nursing school workspace for clinical rotations, care-plan practice, dosage math, flashcards, and anatomy review.">
    <meta name="theme-color" content="#4f46e5">
    <title>Nursing Hub — DueVinci</title>
    <script src="../assets/vendor/tailwindcss.js"></script>
    <script>document.documentElement.dataset.degreeTheme = localStorage.getItem('duevinci_workspace_degree_theme') || 'classic';</script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 900: '#151515', 800: '#1c1c1c', 700: '#2b2b2b', 600: '#3f3f3f' } } } }
        };
        const theme = localStorage.getItem('theme') || 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/icon-32x32.png">
    <link rel="stylesheet" href="../assets/css/greek-theme.css">
    <link rel="stylesheet" href="../assets/css/renaissance-theme.css">
    <link rel="stylesheet" href="../assets/css/degree-theme.css">
    <script src="../assets/vendor/supabase-js.js"></script>
    <script src="../assets/vendor/canvas-confetti.js"></script>
    <script type="module" src="../js/app.js?v=2.8.1"></script>
</head>
<body class="bg-zinc-50 text-zinc-800 dark:bg-brand-900 dark:text-zinc-200 font-sans transition-colors duration-200">
    <div id="appScreen" class="hidden flex h-screen overflow-hidden">
        <duevinci-sidebar></duevinci-sidebar>
        <div class="flex min-w-0 flex-1 flex-col overflow-hidden bg-white dark:bg-brand-900">
            <header class="flex h-16 shrink-0 items-center justify-between gap-4 border-b border-zinc-200 bg-white px-5 dark:border-brand-800 dark:bg-brand-900 sm:px-8">
                <div class="flex min-w-0 items-center gap-4">
                    <button type="button" onclick="toggleSidebar()" class="rounded-lg p-2 text-zinc-600 hover:bg-zinc-100 dark:text-zinc-300 dark:hover:bg-brand-800" aria-label="Toggle sidebar">☰</button>
                    <div class="min-w-0">
                        <h1 class="truncate text-base font-extrabold text-zinc-900 dark:text-white">Nursing Hub</h1>
                        <p class="text-[11px] text-zinc-500 dark:text-zinc-400">Your nursing school workspace</p>
                    </div>
                </div>
                <button type="button" onclick="logout()" class="rounded-lg border border-zinc-200 bg-zinc-100 px-3 py-2 text-sm font-medium text-zinc-800 transition hover:bg-zinc-200 dark:border-brand-600 dark:bg-brand-800 dark:text-white dark:hover:bg-brand-700">Sign out</button>
            </header>
            <main id="nursingHub" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8" aria-label="Nursing Hub workspace"></main>
        </div>
    </div>
</body>
</html>
