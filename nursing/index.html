<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A nursing school workspace for clinical rotations, care-plan practice, dosage math, flashcards, and anatomy review.">
    <meta name="theme-color" content="#4f46e5">
    <title>Nursing Hub — DueVinci</title>
    <script src="../assets/vendor/tailwindcss.js"></script>
    <script>document.documentElement.dataset.degreeTheme = localStorage.getItem('duevinci_workspace_degree_theme') || 'classic';</script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 900: '#151515', 800: '#1c1c1c', 700: '#2b2b2b', 600: '#3f3f3f' } } } }
        };
        const theme = localStorage.getItem('theme') || 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
    <link rel="manifest" href="../manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/icons/icon-32x32.png">
    <link rel="stylesheet" href="../assets/css/greek-theme.css">
    <link rel="stylesheet" href="../assets/css/renaissance-theme.css">
    <link rel="stylesheet" href="../assets/css/degree-theme.css">
    <script src="../assets/vendor/supabase-js.js"></script>
    <script src="../assets/vendor/canvas-confetti.js"></script>
    <script type="module" src="../js/app.js?v=2.8.1"></script>
</head>
<body class="bg-zinc-50 text-zinc-800 dark:bg-brand-900 dark:text-zinc-200 font-sans transition-colors duration-200">
    <div id="appScreen" class="hidden flex h-screen overflow-hidden">
        <duevinci-sidebar></duevinci-sidebar>
        <div class="flex min-w-0 flex-1 flex-col overflow-hidden bg-white dark:bg-brand-900">
            <header class="flex h-16 shrink-0 items-center justify-between gap-2 border-b border-zinc-200 bg-white px-5 dark:border-brand-800 dark:bg-brand-900 sm:gap-4 sm:px-8">
                <div class="flex min-w-0 items-center gap-2 sm:gap-4">
                    <button type="button" onclick="toggleSidebar()" class="inline-flex min-h-[44px] min-w-[44px] shrink-0 items-center justify-center rounded-lg p-2 text-zinc-600 hover:bg-zinc-100 dark:text-zinc-300 dark:hover:bg-brand-800" aria-label="Toggle sidebar">☰</button>
                    <div aria-hidden="true" class="flex h-8 w-8 shrink-0 items-center justify-center text-indigo-600 dark:text-indigo-400 sm:h-10 sm:w-10">
                        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="h-full w-full drop-shadow-sm" focusable="false">
                            <circle cx="50" cy="50" r="44" stroke="currentColor" stroke-width="3" stroke-dasharray="4 4" class="opacity-40"/>
                            <rect x="22" y="22" width="56" height="56" stroke="currentColor" stroke-width="2" class="opacity-30" transform="rotate(45 50 50)"/>
                            <path d="M30 30 L70 30 C85 30 85 50 70 50 L50 80 L30 50 C15 50 15 30 30 30 Z" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
                            <path d="M30 30 L50 80 L70 30" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="opacity-80"/>
                            <line x1="50" y1="30" x2="50" y2="50" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                        </svg>
                    </div>
                    <div class="min-w-0">
                        <h1 class="truncate text-base font-extrabold text-zinc-900 dark:text-white">DueVinci</h1>
                        <p class="truncate text-[11px] text-zinc-500 dark:text-zinc-400">Nursing Hub</p>
                        <p class="hidden truncate text-[10px] text-zinc-500 dark:text-zinc-400 lg:block">Your nursing school workspace</p>
                    </div>
                </div>
                <button type="button" onclick="logout()" class="rounded-lg border border-zinc-200 bg-zinc-100 px-3 py-2 text-sm font-medium text-zinc-800 transition hover:bg-zinc-200 dark:border-brand-600 dark:bg-brand-800 dark:text-white dark:hover:bg-brand-700">Sign out</button>
            </header>
            <main id="nursingHub" class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8" aria-label="Nursing Hub workspace"></main>
        </div>
    </div>
</body>
</html>
