# Local Supabase CLI project settings. Pass the target project explicitly when
# applying migrations or deploying functions.
project_id = "DueVinci-dev"

[api]
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db.migrations]
enabled = true

[db.seed]
enabled = false

[functions.stripe-webhook]
verify_jwt = false

# OAuth callbacks are provider redirects without a Supabase user JWT. The
# callback validates one-time state and exchanges the code server-side.
[functions.calendar-oauth-callback]
verify_jwt = false

# The scheduled worker uses a separate high-entropy Vault secret header rather
# than a user JWT; it processes only opted-in, entitled Canvas connections.
[functions.canvas-scheduled-sync]
verify_jwt = false
