<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grades - DueVinci</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 900: '#18181b', 800: '#27272a', 700: '#3f3f46', 600: '#52525b' }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body class="bg-zinc-50 dark:bg-brand-900 text-zinc-900 dark:text-zinc-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

    <div id="appScreen" class="flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-64 bg-white dark:bg-brand-800 border-r border-zinc-200 dark:border-brand-700 flex flex-col shrink-0 transition-all">
            <div class="h-16 border-b border-zinc-200 dark:border-brand-700 flex items-center px-6 gap-3">
                <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-bold text-sm shadow-sm">DV</div>
                <h1 class="font-extrabold text-base tracking-tight">DueVinci</h1>
            </div>
            <nav class="p-4 space-y-1 flex-1 overflow-y-auto">
                <a href="index.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-brand-700 transition">🏠 Dashboard</a>
                <a href="courses.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-brand-700 transition">📚 Classes</a>
                <a href="grades.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-bold bg-zinc-100 dark:bg-brand-700 text-indigo-600 dark:text-indigo-400 transition">📊 Grades</a>
                <a href="calendar.html" class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-zinc-600 dark:text-zinc-400 hover:bg-zinc-100 dark:hover:bg-brand-700 transition">📅 Calendar</a>
            </nav>
            <div class="p-4 border-t border-zinc-200 dark:border-brand-700">
                <button onclick="logout()" class="w-full py-2 px-3 bg-red-500/10 hover:bg-red-500/20 text-red-500 rounded-xl text-xs font-bold transition">Log Out</button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col min-w-0 overflow-y-auto bg-zinc-50/50 dark:bg-brand-900/50 p-8">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h2 class="text-2xl font-black tracking-tight">Academic Grades & GPA</h2>
                    <p class="text-xs text-zinc-500 dark:text-zinc-400 mt-0.5">Manage and track grades grouped by course and unit.</p>
                </div>
                <div id="gpaBadgeContainer" class="bg-white dark:bg-brand-800 border border-zinc-200 dark:border-brand-700 px-4 py-2 rounded-xl shadow-sm text-right">
                    <span class="text-[10px] font-bold uppercase tracking-wider text-zinc-400 block">Cumulative GPA</span>
                    <span id="cumulativeGpaVal" class="text-lg font-black text-indigo-500">0.00</span>
                </div>
            </header>

            <div id="gradesContainer" class="space-y-6">
                <div class="p-8 text-center text-zinc-400 text-sm">Loading grades breakdown...</div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                if (typeof loadGradesPage === 'function') loadGradesPage();
            }, 300);
        });
    </script>
</body>
</html>
