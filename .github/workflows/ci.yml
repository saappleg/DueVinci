name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  validate:
    name: Syntax, Integrity & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Validate JavaScript Syntax
        run: |
          echo "Checking JavaScript syntax..."
          npm run check:syntax
          echo "All JavaScript files passed syntax check!"

      - name: Run Automated Test Suite
        run: |
          echo "Running Vitest test suite..."
          npm test

      - name: Verify Web App Assets
        run: |
          echo "Checking essential web assets..."
          test -f index.html || { echo "Missing index.html"; exit 1; }
          test -f courses/index.html || { echo "Missing courses/index.html"; exit 1; }
          test -f grades/index.html || { echo "Missing grades/index.html"; exit 1; }
          test -f calendar/index.html || { echo "Missing calendar/index.html"; exit 1; }
          test -f manifest.json || { echo "Missing manifest.json"; exit 1; }
          test -f sw.js || { echo "Missing sw.js"; exit 1; }
          test -f js/app.js || { echo "Missing js/app.js"; exit 1; }
          test -f assets/css/greek-theme.css || { echo "Missing greek-theme.css"; exit 1; }
          echo "All core assets verified successfully!"
