name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Deployment must be gated by the same checks developers run locally.
      # The CI workflow runs independently, so it cannot protect this job.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Verify release
        run: |
          npm ci
          npm run check:syntax
          npm test

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage committed static site files
        run: |
          site_root="$RUNNER_TEMP/duevinci-static-site"
          mkdir -p "$site_root"
          site_paths=(CNAME index.html llms.txt manifest.json robots.txt sitemap.xml sw.js assets calendar components courses grades js legal nursing tutor)
          if git cat-file -e HEAD:about 2>/dev/null; then
            site_paths+=(about)
          fi
          git archive --format=tar HEAD -- "${site_paths[@]}" | tar -xf - -C "$site_root"
          test -s "$site_root/about/index.html"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/duevinci-static-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Run deployed release smoke test
        env:
          DUEVINCI_RELEASE_URL: ${{ steps.deployment.outputs.page_url }}
          DUEVINCI_SMOKE_EMAIL: ${{ secrets.DUEVINCI_SMOKE_EMAIL }}
          DUEVINCI_SMOKE_PASSWORD: ${{ secrets.DUEVINCI_SMOKE_PASSWORD }}
          DUEVINCI_SMOKE_SUPABASE_URL: https://lzmsguzlmjmedlaybckc.supabase.co
          DUEVINCI_SMOKE_SUPABASE_ANON_KEY: sb_publishable_RMNFdMwGYzdOGBCMLgqO9Q_HhiHkEpZ
          DUEVINCI_SMOKE_SKIP_SUPPORT: 'true'
        run: node scripts/release-smoke.mjs
