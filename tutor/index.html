</head><body class="bg-zinc-50 text-zinc-800 dark:bg-brand-900 dark:text-zinc-200">
<div id="appScreen" class="hidden flex h-screen overflow-hidden"><duevinci-sidebar></duevinci-sidebar><div class="flex min-w-0 flex-1 flex-col"><header class="flex h-16 shrink-0 items-center gap-4 border-b border-zinc-200 bg-white px-5 dark:border-brand-800 dark:bg-brand-900"><button type="button" onclick="toggleSidebar()" class="rounded-lg p-2 text-zinc-600 hover:bg-zinc-100 dark:text-zinc-300 dark:hover:bg-brand-800" aria-label="Toggle sidebar">☰</button><div><h1 class="font-extrabold text-zinc-900 dark:text-white">Socratic Study Companion</h1><p class="text-xs text-zinc-500 dark:text-zinc-400">Included with Canvas Sync</p></div></header>
<main class="flex-1 overflow-y-auto p-5 sm:p-8"><section id="tutorPaywall" class="hidden mx-auto max-w-2xl rounded-3xl border border-indigo-200 bg-indigo-50 p-8 text-center dark:border-indigo-900/70 dark:bg-indigo-950/30"><div class="text-4xl">🧠</div><h2 class="mt-3 text-2xl font-black text-zinc-900 dark:text-white">Learn it—don’t just get the answer.</h2><p class="mt-2 text-sm text-zinc-600 dark:text-zinc-300">The Socratic Study Companion is included with the Canvas Sync subscription and its 30-day trial.</p><button type="button" onclick="openSettingsModal(); switchSettingsTab('canvas')" class="mt-5 rounded-xl bg-indigo-600 px-4 py-3 text-sm font-bold text-white">View subscription</button></section>
<section id="tutorWorkspace" class="hidden mx-auto flex h-full max-w-3xl flex-col"><div class="mb-4 flex items-center justify-between gap-3"><label class="text-sm font-bold">Study context <select id="tutorCourse" class="ml-2 rounded-lg border border-zinc-300 bg-white p-2 text-sm dark:border-brand-600 dark:bg-brand-800"></select></label><span class="text-xs text-zinc-500">Guidance, not answer-writing</span></div><div id="tutorMessages" class="flex min-h-[320px] flex-1 flex-col gap-3 overflow-y-auto rounded-3xl border border-zinc-200 bg-white p-5 dark:border-brand-700 dark:bg-brand-900"></div><form class="mt-4 flex gap-2" onsubmit="event.preventDefault(); submitTutorMessage()"><textarea id="tutorInput" maxlength="2000" rows="2" placeholder="What are you trying to understand?" class="min-w-0 flex-1 resize-none rounded-xl border border-zinc-300 bg-white p-3 text-sm dark:border-brand-600 dark:bg-brand-800"></textarea><button id="tutorSend" type="submit" class="rounded-xl bg-indigo-600 px-5 text-sm font-bold text-white">Send</button></form></section></main></div></div>
