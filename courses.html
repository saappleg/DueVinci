<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DueVinci - Classes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: { extend: { colors: { brand: { 900: '#151515', 800: '#1c1c1c', 700: '#2b2b2b', 600: '#3f3f3f' } } } }
        }
    </script>
    <script>
        const theme = localStorage.getItem('theme') || 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.classList.add('dark'); } 
        else { document.documentElement.classList.remove('dark'); }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <!-- Include Tesseract.js for visual screenshot OCR scanning -->
    <script src='https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="timers.js" defer></script>
    <script src="academics.js" defer></script>
    <script src="app.js?v=14" defer></script>
</head>
<body class="bg-zinc-50 dark:bg-brand-900 text-zinc-800 dark:text-zinc-200 font-sans transition-colors duration-200 selection:bg-indigo-500/30">

    <div id="appScreen" class="hidden flex h-screen overflow-hidden">
        
        <aside class="w-64 bg-zinc-100 dark:bg-brand-800 border-r border-zinc-200 dark:border-brand-700 flex flex-col justify-between transition-colors duration-200 overflow-y-auto">
            <div class="border-b border-zinc-200 dark:border-brand-700">
                <div class="px-6 pt-6 pb-2 flex justify-between items-center text-zinc-500 dark:text-zinc-400">
                    <span class="text-xs font-bold uppercase tracking-wider">Timer</span>
                    <div class="flex gap-2">
                        <button type="button" onclick="toggleTimerSettings()" title="Custom Timer" class="hover:text-zinc-800 dark:hover:text-white transition"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
                        <button type="button" onclick="toggleTimerCollapse()" title="Collapse Timer" class="hover:text-zinc-800 dark:hover:text-white transition" id="timerCollapseIcon"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
                    </div>
                </div>

                <div id="timerSettingsForm" class="hidden px-6 pb-4 text-sm text-zinc-600 dark:text-zinc-400 space-y-2">
                    <div class="flex justify-between items-center gap-2">
                        <label class="flex-1">Focus: <input type="number" id="focusMinInput" class="w-16 border rounded p-1 ml-1 dark:bg-brand-900 dark:border-brand-600" value="25"></label>
                        <label class="flex-1">Break: <input type="number" id="breakMinInput" class="w-16 border rounded p-1 ml-1 dark:bg-brand-900 dark:border-brand-600" value="5"></label>
                    </div>
                    <button type="button" onclick="saveTimerSettings()" class="w-full bg-indigo-600 text-white font-bold py-1.5 rounded hover:bg-indigo-700 transition text-xs">Save Time</button>
                </div>

                <div id="timerContent" class="px-6 pb-6 flex flex-col items-center transition-all overflow-hidden">
                    <div class="relative w-40 h-40 rounded-full border-4 border-zinc-300 dark:border-brand-600 flex flex-col items-center justify-center mb-4">
                        <svg class="absolute top-0 left-0 w-full h-full -rotate-90" viewBox="0 0 100 100"><circle id="timerProgress" cx="50" cy="50" r="48" fill="none" stroke="currentColor" stroke-width="4" class="text-indigo-500" stroke-dasharray="301.59" stroke-dashoffset="0" style="transition: stroke-dashoffset 1s linear;"></circle></svg>
                        <span id="timerDisplay" class="text-3xl font-bold dark:text-white tracking-wider z-10">25:00</span>
                        <span id="timerLabel" class="text-sm text-zinc-500 dark:text-zinc-400 z-10 mt-1">Focus</span>
                    </div>

                    <div class="flex items-center gap-4 mb-6 text-zinc-500 dark:text-zinc-400">
                        <button type="button" onclick="resetTimer()" class="hover:text-zinc-800 dark:hover:text-white transition"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
                        <button type="button" onclick="toggleTimer()" id="timerPlayBtn" class="bg-white dark:bg-zinc-100 text-zinc-900 p-3 rounded-lg shadow-sm hover:scale-105 transition"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
                        <button type="button" onclick="skipTimer()" class="hover:text-zinc-800 dark:hover:text-white transition"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 4v16M9 4l10 8-10 8V4z"/></svg></button>
                    </div>
                </div>
            </div>

            <div class="p-4 flex-1">
                <nav class="space-y-1">
                    <a href="index.html" class="flex items-center gap-3 w-full text-left px-4 py-2.5 text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200 dark:hover:bg-brand-700 rounded-lg text-sm transition"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg> Dashboard</a>
                    <a href="courses.html" class="flex items-center gap-3 w-full text-left px-4 py-2.5 bg-zinc-200 dark:bg-brand-700 text-zinc-900 dark:text-white rounded-lg font-medium text-sm transition"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg> Classes</a>
                    <a href="calendar.html" class="flex items-center gap-3 w-full text-left px-4 py-2.5 text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200 dark:hover:bg-brand-700 rounded-lg text-sm transition"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Calendar</a>
                </nav>
            </div>

            <div class="p-4">
                <button type="button" onclick="openSettingsModal()" class="flex items-center gap-3 w-full text-left px-4 py-2.5 bg-zinc-900 dark:bg-black text-white rounded-lg text-sm font-medium hover:bg-zinc-800 dark:hover:bg-brand-900 transition shadow-md">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Settings
                </button>
            </div>
        </aside>

        <div class="flex-1 flex flex-col overflow-hidden bg-white dark:bg-brand-900">
            <header class="h-16 border-b border-zinc-200 dark:border-brand-800 flex items-center justify-end px-8 gap-4 bg-white dark:bg-brand-900">
                <button type="button" onclick="logout()" class="flex items-center gap-2 bg-zinc-100 dark:bg-brand-800 text-zinc-800 dark:text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-zinc-200 dark:hover:bg-brand-700 transition border border-zinc-200 dark:border-brand-600">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Sign out
                </button>
            </header>

            <main class="flex-1 p-8 overflow-y-auto" id="coursesGrid">
                <div class="flex justify-between items-end mb-8">
                    <div>
                        <h2 class="text-3xl font-bold dark:text-white mb-1">My Classes</h2>
                        <p class="text-zinc-500 dark:text-zinc-400 text-sm">Add and configure your courses.</p>
                    </div>
                </div>
                
                <div class="space-y-6">
                    <div class="bg-zinc-50 dark:bg-brand-800 p-6 rounded-2xl border border-zinc-200 dark:border-brand-700 transition-colors duration-200 flex items-center justify-between gap-4">
                        <form id="courseForm" class="flex-1 flex gap-3 items-center">
                            <input type="text" id="courseEmoji" placeholder="📚" maxlength="2" required class="w-12 h-10 border border-zinc-300 dark:border-brand-600 dark:bg-brand-900 dark:text-white rounded-lg text-center focus:outline-none focus:border-indigo-500 transition">
                            <input type="text" id="courseCode" placeholder="Add a new class (e.g. BE101)" required class="flex-1 h-10 border border-zinc-300 dark:border-brand-600 dark:bg-brand-900 dark:text-white rounded-lg px-3 text-sm focus:outline-none focus:border-indigo-500 transition">
                            <div class="relative w-10 h-10 rounded-lg border border-zinc-300 dark:border-brand-600 overflow-hidden shrink-0 flex items-center justify-center bg-white dark:bg-brand-900">
                                <input type="color" id="courseColor" value="#4f46e5" class="absolute -inset-2 w-16 h-16 cursor-pointer bg-transparent">
                            </div>
                            <button type="submit" class="bg-white dark:bg-zinc-100 text-zinc-900 h-10 px-4 rounded-lg text-sm font-bold flex items-center gap-2 hover:bg-zinc-200 transition shrink-0 shadow-sm">
                                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Add Class
                            </button>
                        </form>
                    </div>
                    <div class="bg-transparent rounded-2xl transition-colors duration-200">
                        <div id="courseList" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Course Settings Modal -->
    <div id="courseModal" class="hidden fixed inset-0 bg-zinc-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-brand-800 border border-zinc-200 dark:border-brand-600 w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            <div class="p-6 border-b border-zinc-200 dark:border-brand-700 flex justify-between items-center bg-zinc-50 dark:bg-brand-900/50">
                <h2 class="text-xl font-bold dark:text-white flex items-center gap-2" id="modalCourseTitle"><span>📚</span> Course Settings</h2>
                <div class="flex items-center gap-3">
                    <button type="button" id="markCourseCompleteBtn" class="text-xs bg-indigo-100 text-indigo-700 hover:bg-indigo-200 dark:bg-indigo-900/30 dark:text-indigo-400 dark:hover:bg-indigo-900/50 px-3 py-1.5 rounded font-bold transition">✔ Mark Complete</button>
                    <button type="button" onclick="closeCourseModal()" class="text-zinc-400 hover:text-zinc-600 dark:hover:text-white text-xl">✕</button>
                </div>
            </div>

            <div class="p-6 overflow-y-auto flex-1 grid grid-cols-1 md:grid-cols-2 gap-8">
                <div class="space-y-6">
                    <div>
                        <h3 class="text-sm font-bold text-zinc-800 dark:text-zinc-300 mb-3">Course Info</h3>
                        <form id="editCourseForm" class="space-y-3">
                            <input type="hidden" id="editCourseId">
                            <div class="flex items-center gap-2">
                                <input type="text" id="editCourseEmoji" maxlength="2" required class="w-14 border border-zinc-300 dark:border-brand-600 dark:bg-brand-900 dark:text-white rounded-lg p-2 text-sm text-center focus:outline-none focus:border-indigo-500">
                                <input type="text" id="editCourseCode" required class="flex-1 border border-zinc-300 dark:border-brand-600 dark:bg-brand-900 dark:text-white rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
                            </div>
                            <div class="flex items-center justify-between border border-zinc-200 dark:border-brand-700 rounded-lg p-2 dark:bg-brand-900">
                                <label class="text-sm font-medium text-zinc-600 dark:text-zinc-400 pl-1">Color Tag:</label>
                                <input type="color" id="editCourseColor" class="w-8 h-8 rounded border-0 cursor-pointer bg-transparent">
                            </div>
                            <button type="submit" class="w-full bg-zinc-100 dark:bg-brand-700 text-zinc-800 dark:text-white py-2 rounded-lg text-sm font-medium hover:bg-zinc-200 dark:hover:bg-brand-600 transition mt-2">Update Info</button>
                        </form>
                        <div id="courseMetadataBox"></div>
                    </div>

                    <!-- Import Sections with Isolated Syllabus Checkbox -->
                    <div class="border-t border-zinc-200 dark:border-brand-700 pt-4 space-y-4">
                        <div>
                            <h3 class="text-sm font-bold text-zinc-800 dark:text-zinc-300 mb-2">📄 Import Syllabus (PDF)</h3>
                            <input type="file" id="syllabusFile" accept=".pdf" class="w-full text-xs text-zinc-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 dark:file:bg-indigo-900/30 dark:file:text-indigo-400 hover:file:bg-indigo-100 cursor-pointer mb-2">
                            
                            <!-- Checkbox isolated specifically under Syllabus Upload -->
                            <label class="flex items-center gap-2 text-xs text-zinc-700 dark:text-zinc-300 cursor-pointer select-none font-medium mb-2">
                                <input type="checkbox" id="syllabusMetadataOnly" class="rounded border-zinc-300 text-indigo-600 focus:ring-indigo-500 w-4 h-4">
                                Don't auto-load lessons/units from this syllabus (Description and Objectives Only)
                            </label>

                            <button type="button" onclick="parseSyllabusPDF()" class="w-full bg-indigo-600 text-white font-bold py-2 rounded-lg text-sm hover:bg-indigo-700 transition shadow-sm">Scan Syllabus Metadata & Objectives</button>
                        </div>

                        <div>
                            <h3 class="text-sm font-bold text-zinc-800 dark:text-zinc-300 mb-2">📸 Import Lessons Screenshot</h3>
                            <p class="text-xs text-zinc-500 dark:text-zinc-400 mb-2">Upload a screenshot of your course breakdown page to scan exact week numbers & dates.</p>
                            <input type="file" id="lessonImageFile" accept="image/*" onchange="parseLessonsImage(this)" class="w-full text-xs text-zinc-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-50 file:text-emerald-700 dark:file:bg-emerald-900/30 dark:file:text-emerald-400 hover:file:bg-emerald-100 cursor-pointer">
                        </div>

                        <p id="pdfStatusMsg" class="text-xs text-center mt-2 hidden"></p>
                    </div>

                    <button type="button" onclick="deleteCurrentCourse()" class="w-full text-red-500 text-sm font-medium mt-2 hover:underline">Delete Class & Coursework</button>
                </div>

                <div class="flex flex-col h-full">
                    <h3 class="text-sm font-bold text-zinc-800 dark:text-zinc-300 mb-3">Weekly Units & Lessons</h3>
                    <form id="addAssignmentForm" class="space-y-2 mb-4 bg-zinc-50 dark:bg-brand-900 p-3 rounded-xl border border-zinc-200 dark:border-brand-700">
                        <div class="flex gap-2">
                            <input type="text" id="assignTitle" placeholder="e.g. Unit 1: How the web works" required class="flex-1 border border-zinc-300 dark:border-brand-600 dark:bg-brand-800 dark:text-white rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500 min-w-0">
                            <input type="number" id="assignUnit" placeholder="Unit #" class="w-20 border border-zinc-300 dark:border-brand-600 dark:bg-brand-800 dark:text-white rounded-lg p-2 text-sm text-center focus:outline-none focus:border-indigo-500" title="Unit Number">
                        </div>
                        <div class="flex gap-2">
                            <input type="date" id="assignDate" required class="flex-1 border border-zinc-300 dark:border-brand-600 dark:bg-brand-800 dark:text-white rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
                            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-indigo-500 transition shadow-sm">Add Unit</button>
                        </div>
                    </form>
                    <div id="assignmentList" class="space-y-2 flex-1 overflow-y-auto"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
