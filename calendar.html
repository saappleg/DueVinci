<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DueVinci - Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 900: '#151515', 800: '#1c1c1c', 700: '#2b2b2b', 600: '#3f3f3f' } } } } }
    </script>
    <script>
        const theme = localStorage.getItem('theme') || 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.classList.add('dark'); } 
        else { document.documentElement.classList.remove('dark'); }
    </script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js?v=5" defer></script>
    <style>
        .dark .fc-col-header-cell-cushion, .dark .fc-daygrid-day-number { color: #e4e4e7; }
        .dark .fc-theme-standard td, .dark .fc-theme-standard th, .dark .fc-theme-standard .fc-scrollgrid { border-color: #2b2b2b; }
        .dark .fc-button-primary { background-color: #1c1c1c; border-color: #2b2b2b; }
        .dark .fc-button-primary:hover { background-color: #2b2b2b; }
        .fc-event { cursor: pointer; }
    </style>
</head>
<body class="bg-zinc-50 dark:bg-brand-900 text-zinc-800 dark:text-zinc-200 font-sans transition-colors duration-200 selection:bg-indigo-500/30">

    <div id="appScreen" class="hidden flex h-screen overflow-hidden">
        
        <aside class="w-64 bg-zinc-100 dark:bg-brand-800 border-r border-zinc-200 dark:border-brand-700 flex flex-col justify-between transition-colors duration-200 overflow-y-auto">
            <div class="border-b border-zinc-200 dark:border-brand-700">
                <div class="px-6 pt-6 pb-2 flex justify-between items-center text-zinc-500 dark:text-zinc-400">
                    <span class="text-xs font-bold uppercase tracking-wider">Timer</span>
                    <div class="flex gap-2">
                        <button type="button" onclick="toggleTimerSettings()" title="Custom Timer" class="hover:text-zinc-800 dark:hover:text-white transition"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
                        <button type="button" onclick="toggleTimerCollapse()" title="Collapse Timer" class="hover:text-zinc-800 dark:hover:text-white transition" id="timerCollapseIcon"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
                    </div>
                </div>

                <div id="timerSettingsForm" class="hidden px-6 pb-4 text-sm text-zinc-600 dark:text-zinc-400 space-y-2">
                    <div class="flex justify-between items-center gap-2">
                        <label class="flex-1">Focus: <input type="number" id="focusMinInput" class="w-16 border rounded p-1 ml-1 dark:bg-brand-900 dark:border-brand-600" value="25"></label>
                        <label class="flex-1">Break: <input type="number" id="breakMinInput" class="w-16 border rounded p-1 ml-1 dark:bg-brand-900 dark:border-brand-600" value="5"></label>
                    </div>
                    <button type="button" onclick="saveTimerSettings()" class="w-full bg-indigo-600 text-white font-bold py-1.5 rounded hover:bg-indigo-700 transition text-xs">Save Time</button>
                </div>

                <div id="timerContent" class="px-6 pb-6 flex flex-col items-center transition-all overflow-hidden">
                    <div class="relative w-40 h-40 rounded-full border-4 border-zinc-300 dark:border-brand-600 flex flex-col items-center justify-center mb-4">
                        <svg class="absolute top-0 left-0 w-full h-full -rotate-90" viewBox="0 0 100 100"><circle id="timerProgress" cx="50" cy="50" r="48" fill="none" stroke="currentColor" stroke-width="4" class="text-indigo-500" stroke-dasharray="301.59" stroke-dashoffset="0" style="transition: stroke-dashoffset 1s linear;"></circle></svg>
                        <span id="timerDisplay" class="text-3xl font-bold dark:text-white tracking-wider z-10">25:00</span>
                        <span id="timerLabel" class="text-sm text-zinc-500 dark:text-zinc-400 z-10 mt-1">Focus</span>
                    </div>

                    <div class="flex items-center gap-4 mb-6 text-zinc-500 dark:text-zinc-400">
                        <button type="button" onclick="resetTimer()" class="hover:text-zinc-800 dark:hover:text-white transition"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
                        <button type="button" onclick="toggleTimer()" id="timerPlayBtn" class="bg-white dark:bg-zinc-100 text-zinc-900 p-3 rounded-lg shadow-sm hover:scale-105 transition"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
                        <button type="button" onclick="skipTimer()" class="hover:text-zinc-800 dark:hover:text-white transition"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 4v16M9 4l10 8-10 8V4z"/></svg></button>
                    </div>
                </div>
            </div>

            <div class="p-4 flex-1">
                <nav class="space-y-1">
                    <a href="index.html" class="flex items-center gap-3 w-full text-left px-4 py-2.5 text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200 dark:hover:bg-brand-700 rounded-lg text-sm transition"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg> Dashboard</a>
                    <a href="courses.html" class="flex items-center gap-3 w-full text-left px-4 py-2.5 text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200 dark:hover:bg-brand-700 rounded-lg text-sm transition"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg> Classes</a>
                    <a href="calendar.html" class="flex items-center gap-3 w-full text-left px-4 py-2.5 bg-zinc-200 dark:bg-brand-700 text-zinc-900 dark:text-white rounded-lg font-medium text-sm transition"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Calendar</a>
                </nav>
            </div>

            <div class="p-4">
                <a href="settings.html" class="flex items-center gap-3 w-full text-left px-4 py-2.5 bg-zinc-900 dark:bg-black text-white rounded-lg text-sm font-medium hover:bg-zinc-800 dark:hover:bg-brand-900 transition shadow-md">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Settings
                </a>
            </div>
        </aside>

        <div class="flex-1 flex flex-col overflow-hidden bg-white dark:bg-brand-900">
            <header class="h-16 border-b border-zinc-200 dark:border-brand-800 flex items-center justify-end px-8 gap-4 bg-white dark:bg-brand-900">
                <button type="button" onclick="logout()" class="flex items-center gap-2 bg-zinc-100 dark:bg-brand-800 text-zinc-800 dark:text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-zinc-200 dark:hover:bg-brand-700 transition border border-zinc-200 dark:border-brand-600">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> Sign out
                </button>
            </header>

            <main class="flex-1 p-8 flex flex-col overflow-hidden h-full">
                <div class="flex justify-between items-end mb-6 shrink-0">
                    <div>
                        <h2 class="text-3xl font-bold dark:text-white mb-1">Schedule</h2>
                        <p class="text-zinc-500 dark:text-zinc-400 text-sm">Click custom events to delete them.</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <button type="button" onclick="openEventModal()" class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700 transition text-sm flex items-center gap-2 shadow-sm">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Add Event
                        </button>
                        <button type="button" onclick="exportToICS()" class="text-sm font-medium text-indigo-500 hover:text-indigo-600 dark:hover:text-indigo-400 transition flex items-center gap-2">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> Export .ics
                        </button>
                    </div>
                </div>
                <div id='calendar' class="flex-1 overflow-y-auto"></div>
            </main>
        </div>
    </div>

    <!-- Custom Event Modal -->
    <div id="eventModal" class="hidden fixed inset-0 bg-zinc-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-brand-800 border border-zinc-200 dark:border-brand-600 w-full max-w-md rounded-2xl shadow-2xl p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold dark:text-white flex items-center gap-2"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Custom Event</h2>
                <button type="button" onclick="closeEventModal()" class="text-zinc-400 hover:text-zinc-700 dark:hover:text-white transition">✕</button>
            </div>
            <form id="customEventForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-zinc-600 dark:text-zinc-300 mb-1">Event Title</label>
                    <input type="text" id="evTitle" required class="w-full border border-zinc-300 dark:border-brand-600 dark:bg-brand-900 dark:text-white rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-zinc-600 dark:text-zinc-300 mb-1">Date</label>
                        <input type="date" id="evDate" required class="w-full border border-zinc-300 dark:border-brand-600 dark:bg-brand-900 dark:text-white rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-600 dark:text-zinc-300 mb-1">Color</label>
                        <input type="color" id="evColor" value="#6366f1" class="w-10 h-[38px] rounded border border-zinc-300 dark:border-brand-600 cursor-pointer bg-transparent block">
                    </div>
                </div>
                <button type="submit" class="w-full bg-zinc-900 dark:bg-indigo-600 text-white font-bold py-2 rounded-lg hover:bg-zinc-800 dark:hover:bg-indigo-700 transition mt-2">Save Event</button>
            </form>
        </div>
    </div>
</body>
</html>
