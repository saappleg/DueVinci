<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DueVinci - Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <!-- Rock-solid Theme Initialization -->
    <script>
        const theme = localStorage.getItem('theme') || 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js" defer></script>
    <style>
        /* Small override to keep FullCalendar text legible in dark mode */
        .dark .fc-col-header-cell-cushion, .dark .fc-daygrid-day-number { color: #f1f5f9; }
        .dark .fc-theme-standard td, .dark .fc-theme-standard th, .dark .fc-theme-standard .fc-scrollgrid { border-color: #334155; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 font-sans transition-colors duration-200">

    <div id="appScreen" class="hidden flex h-screen overflow-hidden">
        
        <!-- Navigation Sidebar -->
        <aside class="w-64 bg-slate-900 dark:bg-slate-950 border-r border-slate-200 dark:border-slate-800 text-white flex flex-col justify-between transition-colors duration-200">
            <div class="p-6">
                <h1 class="text-2xl font-bold text-indigo-400 mb-8">DueVinci</h1>
                <nav class="space-y-2">
                    <a href="index.html" class="block w-full text-left px-4 py-3 text-slate-300 hover:bg-slate-800 rounded-lg transition">🏠 Dashboard</a>
                    <a href="calendar.html" class="block w-full text-left px-4 py-3 bg-indigo-600 rounded-lg font-medium">📅 Calendar</a>
                </nav>
            </div>
            <div class="p-6 border-t border-slate-800 space-y-4">
                <button onclick="exportToICS()" class="w-full bg-slate-800 text-indigo-400 font-medium py-2 px-4 rounded-lg flex items-center justify-center gap-2 hover:bg-slate-700 transition text-sm">
                    Export (.ics)
                </button>
                <div>
                    <label class="text-xs text-slate-400 mb-1 block">Appearance</label>
                    <select id="themeSelect" onchange="changeTheme(this.value)" class="w-full bg-slate-800 text-slate-300 border border-slate-700 rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
                        <option value="system">💻 System</option>
                        <option value="light">☀️ Light</option>
                        <option value="dark">🌙 Dark</option>
                    </select>
                </div>
                <button onclick="logout()" class="w-full text-left px-2 py-2 text-slate-400 hover:text-white transition">🚪 Sign Out</button>
            </div>
        </aside>

        <!-- Main Calendar View -->
        <main class="flex-1 p-8 bg-white dark:bg-slate-900 overflow-y-auto transition-colors duration-200">
            <div id='calendar' class="h-full"></div>
        </main>
    </div>

</body>
</html>
