<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DueVinci - Calendar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 900: '#151515', 800: '#1c1c1c', 700: '#2b2b2b', 600: '#3f3f3f' } } } } }
    </script>
    <script>
        const theme = localStorage.getItem('theme') || 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) { document.documentElement.classList.add('dark'); } 
        else { document.documentElement.classList.remove('dark'); }
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.css"/>
    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.0.1/dist/driver.js.iife.js"></script>
    <style>
        .dark .driver-popover { background-color: #1c1c1c !important; color: #f4f4f5 !important; border: 1px solid #3f3f46 !important; }
        .dark .driver-popover-title { color: #ffffff !important; }
        .dark .driver-popover-description { color: #a1a1aa !important; }
        .dark .fc-col-header-cell-cushion, .dark .fc-daygrid-day-number { color: #e4e4e7; }
        .dark .fc-theme-standard td, .dark .fc-theme-standard th, .dark .fc-theme-standard .fc-scrollgrid { border-color: #2b2b2b; }
        .dark .fc-button-primary { background-color: #1c1c1c; border-color: #2b2b2b; }
        .dark .fc-button-primary:hover { background-color: #2b2b2b; }
        .fc-event { cursor: pointer; }
    </style>
    <link rel="manifest" href="manifest.json">
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="timers.js" defer></script>
    <script src="academics.js?v=24" defer></script>
    <script src="app.js?v=25" defer></script>
</head>
<body class="bg-zinc-50 dark:bg-brand-900 text-zinc-800 dark:text-zinc-200 font-sans transition-colors duration-200 selection:bg-indigo-500/30">

    <div id="appScreen" class="hidden flex h-screen overflow-hidden">
        
        <aside class="w-64 bg-zinc-100 dark:bg-brand-800 border-r border-zinc-200 dark:border-brand-700 flex flex-col justify-between transition-colors duration-200 overflow-y-auto shrink-0">
            <div class="border-b border-zinc-200 dark:border-brand-700">
                <div class="px-6 pt-6 pb-2 flex justify-between items-center text-zinc-500 dark:text-zinc-400">
                    <span class="text-xs font-bold uppercase tracking-wider">Timer</span>
                    <div class="flex gap-2">
                        <button type="button" onclick="toggleTimerSettings()" title="Custom Timer" class="hover:text-zinc-800 dark:hover:text-white transition"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></button>
                        <button type="button" onclick="toggleTimerCollapse()" title="Collapse Timer" class="hover:text-zinc-800 dark:hover:text-white transition" id="timerCollapseIcon"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 15l-6-6-6 6"/></svg></button>
                    </div>
                </div>

                <div id="timerSettingsForm" class="hidden px-6 pb-4 text-sm text-zinc-600 dark:text-zinc-400 space-y-2">
                    <div class="flex justify-between items-center gap-2">
                        <label class="flex-1">Focus (min): <input type="number" id="focusMinInput" class="w-16 border rounded p-1 ml-1 dark:bg-brand-900 dark:border-brand-600" value="25"></label>
                        <label class="flex-1">Break (min): <input type="number" id="breakMinInput" class="w-16 border rounded p-1 ml-1 dark:bg-brand-900 dark:border-brand-600" value="5"></label>
                    </div>
                    <button type="button" onclick="saveTimerSettings()" class="w-full bg-indigo-600 text-white font-bold py-1.5 rounded hover:bg-indigo-700 transition text-xs">Save Time</button>
                </div>

                <div id="timerContent" class="px-6 pb-6 flex flex-col items-center transition-all overflow-hidden">
                    <div class="relative w-40 h-40 rounded-full border-4 border-zinc-300 dark:border-brand-600 flex flex-col items-center justify-center mb-4">
                        <svg class="absolute top-0 left-0 w-full h-full -rotate-90" viewBox="0 0 100 100"><circle id="timerProgress" cx="50" cy="50" r="48" fill="none" stroke="currentColor" stroke-width="4" class="text-indigo-500" stroke-dasharray="301.59" stroke-dashoffset="0" style="transition: stroke-dashoffset 1s linear;"></circle></svg>
                        <span id="timerDisplay" class="text-3xl font-bold dark:text-white tracking-wider z-10">25:00</span>
                        <span id="timerLabel" class="text-sm text-zinc-500 dark:text-zinc-400 z-10 mt-1">Focus</span>
                    </div>

                    <div class="flex items-center gap-4 mb-6 text-zinc-500 dark:text-zinc-400">
                        <button type="button" onclick="resetTimer()" class="hover:text-zinc-800 dark:hover:text-white transition"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></button>
                        <button type="button" onclick="toggleTimer()" id="timerPlayBtn" class="bg-white dark:bg-zinc-100 text-zinc-900 p-3 rounded-lg shadow-sm hover:scale-105 transition"><svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
                        <button type="button" onclick="skipTimer()" class="hover:text-zinc-800 dark:hover:text-white transition"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 4v16M9 4l10 8-10 8V4z"/></svg></button>
                    </div>
                </div>
            </div>

            <div class="p-4 flex-1">
                <nav class="space-y-1">
                    <a href="index.html" class="flex items-center gap-3 w-full text-left px-4 py-2.5 text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200 dark:hover:bg-brand-700 rounded-lg text-sm transition">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg> Dashboard
                    </a>
                    <a href="courses.html" class="flex items-center gap-3 w-full text-left px-4 py-2.5 text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200 dark:hover:bg-brand-700 rounded-lg text-sm transition">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg> Classes
                    </a>
                    <a href="grades.html" class="flex items-center gap-3 w-full text-left px-4 py-2.5 text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200 dark:hover:bg-brand-700 rounded-lg text-sm transition">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg> Grades
                    </a>
                    <a href="calendar.html" class="flex items-center gap-3 w-full text-left px-4 py-2.5 bg-zinc-200 dark:bg-brand-700 text-zinc-900 dark:text-white rounded-lg font-medium text-sm transition">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Calendar
                    </a>
                </nav>
            </div>

            <div class="p-4 border-t border-zinc-200 dark:border-brand-700 space-y-2">
                <button type="button" onclick="openSettingsModal()" class="flex items-center gap-3 w-full text-left px-4 py-2.5 bg-zinc-900 dark:bg-black text-white rounded-lg text-sm font-medium hover:bg-zinc-800 dark:hover:bg-brand-900 transition shadow-md">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Settings
                </button>
                <button type="button" onclick="openSupportModal()" class="flex items-center gap-3 w-full text-left px-4 py-2 bg-indigo-50/70 hover:bg-indigo-100 dark:bg-brand-700/60 dark:hover:bg-brand-700 text-indigo-600 dark:text-indigo-400 rounded-lg text-sm font-medium transition shadow-sm border border-indigo-100 dark:border-brand-600">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z"/></svg> Help & Support
                </button>
                <button type="button" id="interactiveTourSidebarBtn" onclick="startWalkthrough(true)" class="flex items-center gap-3 w-full text-left px-4 py-2 bg-zinc-100 hover:bg-zinc-200 dark:bg-brand-800 dark:hover:bg-brand-700 text-zinc-600 dark:text-zinc-300 rounded-lg text-xs font-medium transition">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg> Interactive Tour
                </button>
                <div class="mt-2 pt-2 border-t border-zinc-200/60 dark:border-brand-700/60 flex items-center justify-between text-[11px] text-zinc-400 dark:text-zinc-500 px-1">
                    <a href="privacy.html" class="hover:text-indigo-600 dark:hover:text-indigo-400 underline underline-offset-2 transition">Privacy & Data</a>
                    <span>•</span>
                    <a href="terms.html" class="hover:text-indigo-600 dark:hover:text-indigo-400 underline underline-offset-2 transition">Terms of Use</a>
                </div>
            </div>
        </aside>

        <div class="flex-1 flex flex-col min-w-0 overflow-hidden bg-white dark:bg-brand-900">
            
            <header class="h-16 border-b border-zinc-200 dark:border-brand-800 flex items-center justify-between px-8 gap-4 bg-white dark:bg-brand-900 shrink-0">
                <div class="flex items-center gap-4">
                    <button type="button" onclick="toggleSidebar()" title="Toggle Sidebar" class="p-2 -ml-2 rounded-lg hover:bg-zinc-100 dark:hover:bg-brand-800 text-zinc-600 dark:text-zinc-300 transition">
                        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
                    </button>
                    <div class="hidden md:flex items-center gap-3">
                        <div class="w-10 h-10 text-indigo-600 dark:text-indigo-400 flex items-center justify-center shrink-0">
                            <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full drop-shadow-sm">
                                <circle cx="50" cy="50" r="44" stroke="currentColor" stroke-width="3" stroke-dasharray="4 4" class="opacity-40"/>
                                <rect x="22" y="22" width="56" height="56" stroke="currentColor" stroke-width="2" class="opacity-30" transform="rotate(45 50 50)"/>
                                <path d="M30 30 L70 30 C85 30 85 50 70 50 L50 80 L30 50 C15 50 15 30 30 30 Z" stroke="currentColor" stroke-width="6" stroke-linejoin="round"/>
                                <path d="M30 30 L50 80 L70 30" stroke="currentColor" stroke-width="4" stroke-linecap="round" class="opacity-80"/>
                                <line x1="50" y1="30" x2="50" y2="50" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
                            </svg>
                        </div>
                        <div>
                            <h1 class="font-extrabold text-zinc-900 dark:text-zinc-100 tracking-tight text-base leading-tight">DueVinci</h1>
                            <p class="text-[11px] text-zinc-500 dark:text-zinc-400 font-medium leading-none mt-0.5">Student Planner</p>
                        </div>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <button type="button" onclick="logout()" class="flex items-center gap-2 bg-zinc-100 dark:bg-brand-800 text-zinc-800 dark:text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-zinc-200 dark:hover:bg-brand-700 transition border border-zinc-200 dark:border-brand-600 sign-out-btn">
                        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg> 
                        <span class="hidden sm:inline">Sign out</span>
                    </button>
                </div>
            </header>

            <main class="flex-1 p-8 flex flex-col overflow-hidden h-full">
                <div class="flex justify-between items-end mb-6 shrink-0">
                    <div>
                        <h2 class="text-3xl font-bold dark:text-white mb-1">Schedule</h2>
                        <p class="text-zinc-500 dark:text-zinc-400 text-sm">Click custom events to delete them.</p>
                    </div>
                    <div class="flex items-center gap-4">
                        <button type="button" onclick="openEventModal()" class="bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-indigo-700 transition text-sm flex items-center gap-2 shadow-sm">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> Add Event
                        </button>
                        <button type="button" onclick="exportToICS()" class="text-sm font-medium text-indigo-500 hover:text-indigo-600 dark:hover:text-indigo-400 transition flex items-center gap-2">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg> Export .ics
                        </button>
                    </div>
                </div>
                <div id='calendar' class="flex-1 overflow-y-auto"></div>
            </main>
        </div>
    </div>

    <!-- Custom Event Modal -->
    <div id="eventModal" class="hidden fixed inset-0 bg-zinc-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-brand-800 border border-zinc-200 dark:border-brand-600 w-full max-w-md rounded-2xl shadow-2xl p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold dark:text-white flex items-center gap-2"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg> Custom Event</h2>
                <button type="button" onclick="closeEventModal()" class="text-zinc-400 hover:text-zinc-700 dark:hover:text-white transition">✕</button>
            </div>
            <form id="customEventForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-zinc-600 dark:text-zinc-300 mb-1">Event Title</label>
                    <input type="text" id="evTitle" required class="w-full border border-zinc-300 dark:border-brand-600 dark:bg-brand-900 dark:text-white rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div class="flex gap-4">
                    <div class="flex-1">
                        <label class="block text-sm font-medium text-zinc-600 dark:text-zinc-300 mb-1">Date</label>
                        <input type="date" id="evDate" required class="w-full border border-zinc-300 dark:border-brand-600 dark:bg-brand-900 dark:text-white rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-zinc-600 dark:text-zinc-300 mb-1">Color</label>
                        <input type="color" id="evColor" value="#6366f1" class="w-10 h-[38px] rounded border border-zinc-300 dark:border-brand-600 cursor-pointer bg-transparent block">
                    </div>
                </div>
                <button type="submit" class="w-full bg-zinc-900 dark:bg-indigo-600 text-white font-bold py-2 rounded-lg hover:bg-zinc-800 dark:hover:bg-indigo-700 transition mt-2">Save Event</button>
            </form>
        </div>
    </div>
</body>
</html>
