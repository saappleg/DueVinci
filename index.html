<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DueVinci - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { 
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 900: '#151515', 800: '#1c1c1c', 700: '#2b2b2b', 600: '#3f3f3f' }
                    }
                }
            }
        }
    </script>
    <script>
        const theme = localStorage.getItem('theme') || 'system';
        if (theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js" defer></script>
</head>
<body class="bg-zinc-50 dark:bg-brand-900 text-zinc-800 dark:text-zinc-200 font-sans transition-colors duration-200 selection:bg-indigo-500/30">

    <!-- Auth Screen -->
    <div id="authScreen" class="flex h-screen w-screen items-center justify-center bg-zinc-100 dark:bg-brand-900">
        <div class="bg-white dark:bg-brand-800 p-8 rounded-2xl shadow-xl max-w-md w-full text-center border border-zinc-200 dark:border-brand-700">
            <h1 class="text-3xl font-bold text-indigo-600 dark:text-white mb-2">DueVinci 📚</h1>
            <p class="text-zinc-500 dark:text-zinc-400 mb-6">Your study materials in one place.</p>
            
            <form id="emailAuthForm" class="space-y-4 mb-4">
                <input type="email" id="authEmail" placeholder="Student Email" required class="w-full border border-zinc-300 dark:border-brand-600 dark:bg-brand-900 dark:text-white rounded-lg p-3 text-sm outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                <input type="password" id="authPassword" placeholder="Password" required class="w-full border border-zinc-300 dark:border-brand-600 dark:bg-brand-900 dark:text-white rounded-lg p-3 text-sm outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
                
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="signInWithEmail()" class="w-1/2 bg-white dark:bg-zinc-100 text-zinc-900 font-bold py-2.5 rounded-xl hover:bg-zinc-200 transition">Sign In</button>
                    <button type="button" onclick="signUpWithEmail()" class="w-1/2 bg-zinc-800 dark:bg-brand-700 text-white font-medium py-2.5 rounded-xl hover:bg-zinc-900 dark:hover:bg-brand-600 transition">Sign Up</button>
                </div>
            </form>
            <p id="authMessage" class="text-sm hidden"></p>
        </div>
    </div>

    <!-- Main App Screen -->
    <div id="appScreen" class="hidden flex h-screen overflow-hidden">
        
        <!-- Navigation Sidebar (Refined styling) -->
        <aside class="w-64 bg-zinc-100 dark:bg-brand-800 border-r border-zinc-200 dark:border-brand-700 flex flex-col justify-between transition-colors duration-200 overflow-y-auto">
            
            <!-- Timer & Actions Section -->
            <div class="p-6 flex flex-col items-center border-b border-zinc-200 dark:border-brand-700">
                <!-- Pomodoro Circle -->
                <div class="relative w-40 h-40 rounded-full border-4 border-zinc-300 dark:border-brand-600 flex flex-col items-center justify-center mb-4">
                    <svg class="absolute top-0 left-0 w-full h-full -rotate-90" viewBox="0 0 100 100">
                        <circle id="timerProgress" cx="50" cy="50" r="48" fill="none" stroke="currentColor" stroke-width="4" class="text-indigo-500" stroke-dasharray="301.59" stroke-dashoffset="0" style="transition: stroke-dashoffset 1s linear;"></circle>
                    </svg>
                    <span id="timerDisplay" class="text-3xl font-bold dark:text-white tracking-wider z-10">25:00</span>
                    <span id="timerLabel" class="text-sm text-zinc-500 dark:text-zinc-400 z-10 mt-1">Focus</span>
                </div>

                <!-- Timer Controls -->
                <div class="flex items-center gap-4 mb-6 text-zinc-500 dark:text-zinc-400">
                    <button onclick="resetTimer()" class="hover:text-zinc-800 dark:hover:text-white transition">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    </button>
                    <button onclick="toggleTimer()" id="timerPlayBtn" class="bg-white dark:bg-zinc-100 text-zinc-900 p-3 rounded-lg shadow-sm hover:scale-105 transition">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button onclick="skipTimer()" class="hover:text-zinc-800 dark:hover:text-white transition">
                        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 4v16M9 4l10 8-10 8V4z"/></svg>
                    </button>
                </div>

                <!-- Action Button -->
                <button class="w-full bg-white dark:bg-brand-900 border border-zinc-200 dark:border-brand-600 text-zinc-800 dark:text-zinc-200 font-medium py-2 px-4 rounded-lg flex items-center justify-center gap-2 hover:bg-zinc-50 dark:hover:bg-brand-700 transition shadow-sm text-sm">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/></svg>
                    Record Lecture
                </button>
            </div>

            <!-- Navigation Links -->
            <div class="p-4 flex-1">
                <nav class="space-y-1">
                    <a href="index.html" class="flex items-center gap-3 w-full text-left px-4 py-2.5 bg-zinc-200 dark:bg-brand-700 text-zinc-900 dark:text-white rounded-lg font-medium text-sm transition">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
                        Dashboard
                    </a>
                    <a href="calendar.html" class="flex items-center gap-3 w-full text-left px-4 py-2.5 text-zinc-600 dark:text-zinc-400 hover:bg-zinc-200 dark:hover:bg-brand-700 rounded-lg text-sm transition">
                        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                        Calendar
                    </a>
                </nav>
            </div>

            <div class="p-4">
                <button class="flex items-center gap-3 w-full text-left px-4 py-2.5 bg-zinc-900 dark:bg-black text-white rounded-lg text-sm font-medium hover:bg-zinc-800 dark:hover:bg-brand-900 transition shadow-md">
                    <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    Settings
                </button>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col overflow-hidden bg-white dark:bg-brand-900">
            
            <!-- Top Header -->
            <header class="h-16 border-b border-zinc-200 dark:border-brand-800 flex items-center justify-end px-8 gap-4 bg-white dark:bg-brand-900">
                <button onclick="cycleTheme()" class="text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-white transition p-2 rounded-full hover:bg-zinc-100 dark:hover:bg-brand-800" title="Toggle Theme">
                    <svg id="themeIcon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <!-- Default to Moon -->
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                </button>
                <button onclick="logout()" class="flex items-center gap-2 bg-zinc-100 dark:bg-brand-800 text-zinc-800 dark:text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-zinc-200 dark:hover:bg-brand-700 transition border border-zinc-200 dark:border-brand-600">
                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
                    Sign out
                </button>
            </header>

            <!-- Dashboard Content -->
            <main class="flex-1 p-8 overflow-y-auto" id="dashboardGrid">
                
                <div class="flex justify-between items-end mb-8">
                    <div>
                        <h2 class="text-3xl font-bold dark:text-white mb-1">Dashboard</h2>
                        <p class="text-zinc-500 dark:text-zinc-400 text-sm">All your study materials in one place.</p>
                    </div>
                </div>
                
                <!-- Content Grid -->
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
                    
                    <!-- Left Column (Up Next & Goals) -->
                    <div class="space-y-6 lg:col-span-1">
                        <!-- Up Next Card -->
                        <div class="bg-zinc-50 dark:bg-brand-800 p-6 rounded-2xl border border-zinc-200 dark:border-brand-700 transition-colors duration-200">
                            <h3 class="text-md font-bold mb-4 text-zinc-800 dark:text-zinc-200 flex items-center gap-2">
                                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
                                Up Next
                            </h3>
                            <ul class="space-y-3" id="upNextList">
                                <p class="text-sm text-zinc-500 dark:text-zinc-400">No upcoming assignments. You're all caught up!</p>
                            </ul>
                        </div>

                        <!-- Course Goals Card -->
                        <div class="bg-zinc-50 dark:bg-brand-800 p-6 rounded-2xl border border-zinc-200 dark:border-brand-700 transition-colors duration-200">
                            <h3 class="text-md font-bold mb-4 text-zinc-800 dark:text-zinc-200 flex items-center gap-2">
                                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 3v18h18M18 17V9l-5 5-4-4-5 5"/></svg>
                                Goals
                            </h3>
                            <div class="space-y-4" id="goalsList">
                                <p class="text-sm text-zinc-500 dark:text-zinc-400">Tracking will start once assignments are added.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column (Courses) -->
                    <div class="lg:col-span-2 space-y-6">
                        
                        <!-- Add Course Form -->
                        <div class="bg-zinc-50 dark:bg-brand-800 p-6 rounded-2xl border border-zinc-200 dark:border-brand-700 transition-colors duration-200 flex items-center justify-between gap-4">
                            <form id="courseForm" class="flex-1 flex gap-3 items-center">
                                <input type="text" id="courseEmoji" placeholder="📚" maxlength="2" required class="w-12 h-10 border border-zinc-300 dark:border-brand-600 dark:bg-brand-900 dark:text-white rounded-lg text-center focus:outline-none focus:border-indigo-500 transition">
                                <input type="text" id="courseCode" placeholder="Add a new class (e.g. CS101)" required class="flex-1 h-10 border border-zinc-300 dark:border-brand-600 dark:bg-brand-900 dark:text-white rounded-lg px-3 text-sm focus:outline-none focus:border-indigo-500 transition">
                                <div class="relative w-10 h-10 rounded-lg border border-zinc-300 dark:border-brand-600 overflow-hidden shrink-0 flex items-center justify-center bg-white dark:bg-brand-900">
                                    <input type="color" id="courseColor" value="#4f46e5" class="absolute -inset-2 w-16 h-16 cursor-pointer bg-transparent">
                                </div>
                                <button type="submit" class="bg-white dark:bg-zinc-100 text-zinc-900 h-10 px-4 rounded-lg text-sm font-bold flex items-center gap-2 hover:bg-zinc-200 transition shrink-0 shadow-sm">
                                    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
                                    Add Class
                                </button>
                            </form>
                        </div>

                        <!-- Active Classes Grid -->
                        <div class="bg-transparent rounded-2xl transition-colors duration-200">
                            <div id="courseList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <!-- Populated dynamically from Supabase -->
                            </div>
                        </div>

                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Course Settings Modal -->
    <div id="courseModal" class="hidden fixed inset-0 bg-zinc-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white dark:bg-brand-800 border border-zinc-200 dark:border-brand-600 w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
            
            <div class="p-6 border-b border-zinc-200 dark:border-brand-700 flex justify-between items-center bg-zinc-50 dark:bg-brand-900/50">
                <h2 class="text-xl font-bold dark:text-white flex items-center gap-2" id="modalCourseTitle">
                    <span>📚</span> Course Settings
                </h2>
                <button onclick="closeCourseModal()" class="text-zinc-400 hover:text-zinc-600 dark:hover:text-white text-xl">✕</button>
            </div>

            <div class="p-6 overflow-y-auto flex-1 grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Edit Course Details -->
                <div>
                    <h3 class="text-sm font-bold text-zinc-800 dark:text-zinc-300 mb-3">Course Info</h3>
                    <form id="editCourseForm" class="space-y-3">
                        <input type="hidden" id="editCourseId">
                        <div class="flex items-center gap-2">
                            <input type="text" id="editCourseEmoji" maxlength="2" required class="w-14 border border-zinc-300 dark:border-brand-600 dark:bg-brand-900 dark:text-white rounded-lg p-2 text-sm text-center focus:outline-none focus:border-indigo-500">
                            <input type="text" id="editCourseCode" required class="flex-1 border border-zinc-300 dark:border-brand-600 dark:bg-brand-900 dark:text-white rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                        <div class="flex items-center justify-between border border-zinc-200 dark:border-brand-700 rounded-lg p-2 dark:bg-brand-900">
                            <label class="text-sm font-medium text-zinc-600 dark:text-zinc-400 pl-1">Color Tag:</label>
                            <input type="color" id="editCourseColor" class="w-8 h-8 rounded border-0 cursor-pointer bg-transparent">
                        </div>
                        <button type="submit" class="w-full bg-zinc-100 dark:bg-brand-700 text-zinc-800 dark:text-white py-2 rounded-lg text-sm font-medium hover:bg-zinc-200 dark:hover:bg-brand-600 transition mt-2">Update Info</button>
                    </form>
                    <button onclick="deleteCurrentCourse()" class="w-full text-red-500 text-sm font-medium mt-6 hover:underline">Delete Class & Assignments</button>
                </div>

                <!-- Assignments Section -->
                <div class="flex flex-col h-full">
                    <h3 class="text-sm font-bold text-zinc-800 dark:text-zinc-300 mb-3">Assignments</h3>
                    
                    <form id="addAssignmentForm" class="flex gap-2 mb-4">
                        <input type="text" id="assignTitle" placeholder="e.g. Midterm Essay" required class="flex-1 border border-zinc-300 dark:border-brand-600 dark:bg-brand-900 dark:text-white rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500 min-w-0">
                        <input type="date" id="assignDate" required class="w-32 border border-zinc-300 dark:border-brand-600 dark:bg-brand-900 dark:text-white rounded-lg p-2 text-sm focus:outline-none focus:border-indigo-500">
                        <button type="submit" class="bg-indigo-600 text-white px-3 py-2 rounded-lg text-sm font-bold hover:bg-indigo-500 transition shadow-sm">+</button>
                    </form>

                    <div id="assignmentList" class="space-y-2 flex-1 overflow-y-auto">
                        <!-- Assignments pop in here -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
