<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DueVinci - Student Planner</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FullCalendar CSS & JS -->
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js'></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Your Custom App Logic -->
    <script src="app.js" defer></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">

    <!-- Auth Screen -->
    <div id="authScreen" class="flex h-screen w-screen items-center justify-center bg-slate-100">
        <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
            <h1 class="text-3xl font-bold text-indigo-600 mb-2">DueVinci 📚</h1>
            <p class="text-slate-500 mb-6">Manage syllabi, color-code classes, and sync deadlines.</p>
            
            <!-- Email & Password Form -->
            <form id="emailAuthForm" class="space-y-4 mb-4">
                <input type="email" id="authEmail" placeholder="Student Email" required class="w-full border border-slate-300 rounded-lg p-3 text-sm outline-none focus:border-indigo-500">
                <input type="password" id="authPassword" placeholder="Password" required class="w-full border border-slate-300 rounded-lg p-3 text-sm outline-none focus:border-indigo-500">
                
                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="signInWithEmail()" class="w-1/2 bg-indigo-600 text-white font-medium py-2.5 rounded-xl hover:bg-indigo-700 transition">
                        Sign In
                    </button>
                    <button type="button" onclick="signUpWithEmail()" class="w-1/2 bg-slate-800 text-white font-medium py-2.5 rounded-xl hover:bg-slate-900 transition">
                        Sign Up
                    </button>
                </div>
            </form>
            
            <!-- Message Display for Auth Errors/Success -->
            <p id="authMessage" class="text-sm hidden"></p>
        </div>
    </div>

    <!-- Main App Screen (Hidden until logged in) -->
    <div id="appScreen" class="hidden flex h-screen overflow-hidden">
        
        <aside class="w-1/3 bg-white border-r border-slate-200 p-6 flex flex-col justify-between overflow-y-auto">
            <div>
                <div class="flex justify-between items-center mb-6">
                    <h1 class="text-2xl font-bold text-indigo-600">DueVinci</h1>
                    <button onclick="logout()" class="text-xs text-red-500 hover:underline">Sign Out</button>
                </div>

                <!-- Add Course Form -->
                <div class="mb-6 p-4 bg-slate-50 rounded-xl border border-slate-100">
                    <h2 class="text-sm font-semibold text-slate-600 mb-3">Add New Course</h2>
                    <form id="courseForm" class="space-y-3">
                        <input type="text" id="courseCode" placeholder="e.g. CS101: Data Structures" required class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                        
                        <div class="flex items-center justify-between">
                            <label class="text-xs text-slate-500">Class Color Tag:</label>
                            <input type="color" id="courseColor" value="#4f46e5" class="w-8 h-8 rounded border-0 cursor-pointer">
                        </div>
                        
                        <button type="submit" class="w-full bg-slate-900 text-white py-2 rounded-lg text-sm font-medium hover:bg-slate-800 transition">
                            Save Course
                        </button>
                    </form>
                </div>

                <!-- Course List -->
                <div>
                    <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">My Classes</h2>
                    <div id="courseList" class="space-y-2">
                        <!-- Populated dynamically from Supabase -->
                    </div>
                </div>
            </div>

            <!-- Calendar Export Action -->
            <div class="pt-4 border-t border-slate-200">
                <button onclick="exportToICS()" class="w-full bg-indigo-50 text-indigo-700 font-medium py-2 px-4 rounded-lg flex items-center justify-center gap-2 hover:bg-indigo-100 transition text-sm">
                    Export Calendar (.ics file)
                </button>
            </div>
        </aside>

        <!-- Main Calendar View -->
        <main class="w-2/3 p-8 bg-white overflow-y-auto">
            <div id='calendar' class="h-full"></div>
        </main>
    </div>
</body>
</html>
